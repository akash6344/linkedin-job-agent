[project]
name = "linkedin-job-agent"
version = "0.2.0"
description = "LinkedIn personal job agent + ApplyDesk India SaaS job-search copilot"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.40.0",
    "ollama>=0.3.0",
]

[project.optional-dependencies]
saas = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "cryptography>=42.0.0",
    "itsdangerous>=2.1.0",
]

[project.scripts]
linkedin-agent = "linkedin_agent.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobsearch_saas = ["templates/**/*.html", "static/*"]
